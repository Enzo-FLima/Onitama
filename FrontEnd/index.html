<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onitama - Movimentação das Peças</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            /* Substitua o caminho abaixo pela sua imagem de fundo geral */
            background-image: url('Assets/fundo_Onitama.png'); 
            background-size: cover;       /* Faz a imagem cobrir a tela inteira sem distorcer */
            background-position: center;  /* Centraliza a imagem na tela */
            background-repeat: no-repeat; /* Impede que a imagem fique se repetindo em mosaico */
            background-attachment: fixed; /* Deixa o fundo fixo se houver rolagem */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .tabuleiro-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            /* A imagem fornecida tem a proporção exata de 1.83 (Largura / Altura) */
            aspect-ratio: 1000 / 546; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin: 0 auto;
        }

        .imagem-fundo {
            width: 100%;
            height: 100%;     /* Faz a altura acompanhar a largura perfeitamente */
            display: block;
            pointer-events: none;
        }

        .grade-interativa {
            position: absolute;
            /* Ajustes milimétricos baseados na proporção da nova imagem */
            top: 12.5%;     /* Alinha perfeitamente com a linha preta superior */
            left: 30.0%;    /* Move o início do grid para a primeira linha preta vertical */
            width: 39.7%;   /* Largura total cobrindo as 5 colunas do desenho */
            height: 75.0%;  /* Altura total cobrindo as 5 linhas do desenho */
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
        }

        .quadrado {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Destaca sutilmente o cubo central para teste visual */
        .quadrado[data-tipo="cubo"] {
            outline: 1px dashed rgba(255, 255, 255, 0.1);
        }

        /* Efeito visual quando uma peça está sendo arrastada sobre o quadrado */
        .quadrado.drag-over {
            background: rgba(76, 175, 80, 0.3) !important; /* Verde translúcido */
        }

        /* --- ESTILO DAS CARTAS CORRIGIDO --- */
        .zona-carta {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.15);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Cartas do Adversário (Topo) - Invertidas em 270deg para que o oponente veja o verso do lado correto */
         .carta-topo-1 { 
            top: -24.5%; 
            left: 29.0%; 
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); /* Mantém deitada acompanhando o contêiner */
        }
        .carta-topo-2 { 
            top: -24.5%; 
            left: 51.8%; 
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); 
        }
        
        /* Cartas do Jogador Azul (Baixo) - Deitadas horizontalmente */
        .carta-baixo-1 { 
            bottom: -24.5%; 
            left: 29.0%; 
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); 
        }
        .carta-baixo-2 { 
            bottom: -24.5%; 
            left: 51.8%; 
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); 
        }
        
        /* Carta Lateral Direita - Deitada horizontalmente no slot da direita */
        .carta-lateral { 
            top: 42.5%; 
            right: -13.5%; 
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); 
        }

        /* Verso do Baralho/Deck na Esquerda - Deitada horizontalmente no slot da esquerda */
        .baralho-deck { 
            top: 42.5%; 
            left: -13.5%;            
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); 
            background-image: url('Assets/Carta_Inversa_Onitama.png'); 
            background-color: rgba(139, 0, 0, 0.35); 
            border-color: rgba(139, 0, 0, 0.6); 
            background-size: cover; 
        }

        /* --- ESTILO DAS PEÇAS CORRIGIDO E AUMENTADO --- */
        .peca {
            box-sizing: border-box;
            width: 90%;
            height: auto;
            max-width: 90%;
            max-height: 90%;
            aspect-ratio: 1 / 1;
            border-radius: 50%; 
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.15rem;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            user-select: none;
            z-index: 3;
            transition: filter 0.15s ease, box-shadow 0.15s ease;
        }

        .peca:hover {
            filter: brightness(1.12);
        }

        .peca:active {
            cursor: grabbing;
            filter: brightness(0.95);
        }

        /* Peças do Jogador Azul */
        .peca.azul { 
            background: radial-gradient(circle at 35% 35%, #42a5f5, #1976d2); 
            border: 2px solid #0d47a1; 
        }

        .peca.azul.mestre { 
            width: 96%;
            max-width: 96%;
            max-height: 96%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #1e88e5, #0d47a1); 
            border: 3px solid #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.65), 0 4px 8px rgba(0, 0, 0, 0.4);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }  

        /* Peças do Jogador Vermelho */
        .peca.vermelho { 
            background: radial-gradient(circle at 35% 35%, #ef5350, #d32f2f); 
            border: 2px solid #b71c1c; 
        }

        .peca.vermelho.mestre { 
            width: 96%;
            max-width: 96%;
            max-height: 96%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #e53935, #b71c1c); 
            border: 3px solid #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.65), 0 4px 8px rgba(0, 0, 0, 0.4);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="tabuleiro-container">
        <img class="imagem-fundo" src="Assets/tabuleir_onitama_melhorado.png" alt="Tabuleiro">
        
        <!-- Tabuleiro Central -->
        <div class="grade-interativa" id="grade"></div>

        <!-- Zonas das Cartas -->
        <div class="zona-carta carta-topo-1" id="carta-vermelho-1"></div>
        <div class="zona-carta carta-topo-2" id="carta-vermelho-2"></div>
        <div class="zona-carta carta-baixo-1" id="carta-azul-1"></div>
        <div class="zona-carta carta-baixo-2" id="carta-azul-2"></div>
        <div class="zona-carta carta-lateral" id="carta-reserva"></div>

        <!-- Espaço para o Baralho -->
        <div class="zona-carta baralho-deck" id="deck-baralho">BARALHO</div>
    </div>


    <script>
        const grade = document.getElementById('grade');
        
        // ==========================================
        // CONFIGURAÇÃO DO SISTEMA DE CARTAS
        // ==========================================
        
        // 1. Defina o nome da carta e o caminho da imagem dela na sua pasta Assets
        const listaCartas = [
        // Jogo Base (16 Cartas Clássicas)
            { nome: 'Sapo', imagem: 'Assets/sapo.png' },
            { nome: 'Dragão', imagem: 'Assets/dragao.png' },
            { nome: 'Serpente do Mar', imagem: 'Assets/serpente.png' },
            { nome: 'Tigre', imagem: 'Assets/tigre.png' },
            { nome: 'Caranguejo', imagem: 'Assets/caranguejo.png' },
            { nome: 'Macaco', imagem: 'Assets/macaco.png' },
            { nome: 'Garça', imagem: 'Assets/garca.png' },
            { nome: 'Galo', imagem: 'Assets/galo.png' },
            { nome: 'Boi', imagem: 'Assets/boi.png' },
            { nome: 'Cavalo', imagem: 'Assets/cavalo.png' },
            { nome: 'Enguia', imagem: 'Assets/enguia.png' },
            { nome: 'Elefante', imagem: 'Assets/elefante.png' },
            { nome: 'Louva-a-Deus', imagem: 'Assets/louva_deus.png' },
            { nome: 'Javali', imagem: 'Assets/javali.png' },
            { nome: 'Coelho', imagem: 'Assets/coelho.png' },
            { nome: 'Ganso', imagem: 'Assets/ganso.png' },

            // Expansão: Sensei's Path (16 Cartas Adicionais)
            { nome: 'Girafa', imagem: 'Assets/girafa.png' },
            { nome: 'Fênix', imagem: 'Assets/fenix.png' },
            { nome: 'Tartaruga', imagem: 'Assets/tartaruga.png' },
            { nome: 'Cachorro', imagem: 'Assets/cachorro.png' },
            { nome: 'Rato', imagem: 'Assets/rato.png' },
            { nome: 'Cobra', imagem: 'Assets/cobra.png' },
            { nome: 'Lontra', imagem: 'Assets/lontra.png' },
            { nome: 'Panda', imagem: 'Assets/panda.png' },
            { nome: 'Urso', imagem: 'Assets/urso.png' },
            { nome: 'Raposa', imagem: 'Assets/raposa.png' }
        ];
        // 2. Função para embaralhar e sortear 5 cartas únicas
        function sortearCartas() {
            let embaralhado = [...listaCartas];
            
            // Algoritmo clássico de embaralhamento (Fisher-Yates)
            for (let i = embaralhado.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [embaralhado[i], embaralhado[j]] = [embaralhado[j], embaralhado[i]];
            }

            // Distribuindo as cartas sorteadas
            const cartasSorteadas = {
                vermelho1: embaralhado[0],
                vermelho2: embaralhado[1],
                azul1: embaralhado[2],
                azul2: embaralhado[3],
                reserva: embaralhado[4]
            };

            // Aplicar visualmente: passamos 'true' para ocultar e 'false' para mostrar livremente
            // Supondo que a perspectiva inicial da tela seja do Jogador Azul (baixo):
            aplicarCartaNaZona('carta-vermelho-1', cartasSorteadas.vermelho1, true);  // Oculta (Verso)
            aplicarCartaNaZona('carta-vermelho-2', cartasSorteadas.vermelho2, true);  // Oculta (Verso)
            
            aplicarCartaNaZona('carta-azul-1', cartasSorteadas.azul1, false);         // Aberta
            aplicarCartaNaZona('carta-azul-2', cartasSorteadas.azul2, false);         // Aberta
            
            aplicarCartaNaZona('carta-reserva', cartasSorteadas.reserva, false);
        }

        // 3. Auxiliar para injetar o fundo (aberto ou verso oculto)
        function aplicarCartaNaZona(idElemento, dadosCarta, deveOcultar) {
            const elemento = document.getElementById(idElemento);
            if (elemento) {
                elemento.style.border = 'none';

                if (deveOcultar) {
                    // Se deve ocultar, aplica a imagem de verso e muda o texto
                    elemento.style.backgroundImage = "url('Assets/Carta_Inversa_Onitama.png')"; // Imagem de verso
                    elemento.style.backgroundColor = "rgba(139, 0, 0, 0.6)"; // Cor escura de segurança
                    elemento.innerText = ""; // Esconde o nome do movimento do rival
                } else {
                    // Se estiver aberta, mostra as informações reais normalmente
                    elemento.style.backgroundImage = `url('${dadosCarta.imagem}')`;
                    //elemento.innerText = dadosCarta.nome; 
                    elemento.style.textShadow = '1px 1px 3px black';
                    elemento.style.color = '#fff';
                }
            }
        }

        sortearCartas();

        // ==========================================
        // GERAÇÃO DO TABULEIRO E PEÇAS
        // ==========================================

        // 1. GERAR O TABULEIRO
        for (let linha = 0; linha < 5; linha++) {
            for (let coluna = 0; coluna < 5; coluna++) { // Corrigido para coluna++
                const div = document.createElement('div');
                div.classList.add('quadrado');
                div.dataset.tipo = 'cubo';
                div.dataset.linhaCubo = linha;
                div.dataset.colunaCubo = coluna;
                
                div.id = `quadrado-${linha}-${coluna}`; // IDs agora vão de 0 a 4
                configurarZonaDeSoltura(div);
                grade.appendChild(div);
            }
        }

        // 2. ADICIONAR AS PEÇAS INICIAIS DO ONITAMA (Na linha 0 e linha 4 do cubo)
        // Jogador Azul (Inicia embaixo - Linha 4 do cubo central)
        criarPeca('azul', 'aluno', 'quadrado-4-0', 'A');
        criarPeca('azul', 'aluno', 'quadrado-4-1', 'A');
        criarPeca('azul', 'mestre', 'quadrado-4-2', 'MESTRE'); // Mestre no centro
        criarPeca('azul', 'aluno', 'quadrado-4-3', 'A');
        criarPeca('azul', 'aluno', 'quadrado-4-4', 'A');

        // Jogador Vermelho (Inicia em cima - Linha 0 do cubo central)
        criarPeca('vermelho', 'aluno', 'quadrado-0-0', 'A');
        criarPeca('vermelho', 'aluno', 'quadrado-0-1', 'A');
        criarPeca('vermelho', 'mestre', 'quadrado-0-2', 'MESTRE'); // Mestre no centro
        criarPeca('vermelho', 'aluno', 'quadrado-0-3', 'A');
        criarPeca('vermelho', 'aluno', 'quadrado-0-4', 'A');


        // FUNÇÃO PARA CRIAR PEÇAS DINAMICAMENTE
        function criarPeca(time, tipo, idQuadradoAlvo, texto) {
            const peca = document.createElement('div');
            peca.classList.add('peca', time, tipo);
            peca.innerText = texto;
            peca.draggable = true; // Ativa o Drag do HTML5
            
            // Dá uma ID única para a peça para podermos rastreá-la no arrasto
            peca.id = `peca-${time}-${tipo}-${idQuadradoAlvo}`;

            // Eventos do Drag (Arrastar)
            peca.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
            });

            // Coloca a peça dentro do quadrado inicial correspondente
            document.getElementById(idQuadradoAlvo).appendChild(peca);
        }

        // FUNÇÃO PARA PERMITIR SOLTAR PEÇAS APENAS NO CUBO 5X5
        function configurarZonaDeSoltura(quadrado) {
            // Quando a peça está voando por cima do quadrado
            quadrado.addEventListener('dragover', (e) => {
                e.preventDefault(); // Obrigatório para permitir que o 'drop' aconteça
                quadrado.classList.add('drag-over');
            });

            // Quando a peça sai de cima do quadrado sem soltar
            quadrado.addEventListener('dragleave', (e) => {
                if (!quadrado.contains(e.relatedTarget)) {
                    quadrado.classList.remove('drag-over');
                }
            });

            // Quando o jogador solta o clique do mouse (Soltar a peça)
            quadrado.addEventListener('drop', (e) => {
                e.preventDefault();
                quadrado.classList.remove('drag-over');

                const idPeca = e.dataTransfer.getData('text/plain');
                const pecaArrastada = document.getElementById(idPeca);

                if (!pecaArrastada) return;

                // Regra Básica 1: Captura de peça (Se já tiver uma peça ali)
                const pecaExistente = quadrado.querySelector('.peca');
                if (pecaExistente) {
                    // Se soltou na mesma casa onde a peça já estava, apenas encerra sem erro
                    if (pecaExistente === pecaArrastada) {
                        return;
                    }

                    // Verifica se a peça que já estava lá é do mesmo time
                    const timeArrastada = pecaArrastada.classList.contains('azul') ? 'azul' : 'vermelho';
                    if (pecaExistente.classList.contains(timeArrastada)) {
                        alert("Você não pode mover para uma casa ocupada por sua própria peça!");
                        return;
                    } else {
                        // Se for do time inimigo, remove ela (Captura!)
                        console.log(`Peça inimiga ${pecaExistente.id} foi capturada!`);
                        pecaExistente.remove();
                    }
                }

                // Move o elemento HTML da peça para dentro do novo quadrado clicado
                quadrado.appendChild(pecaArrastada);
                
                console.log(`Peça movida para a casa do Cubo: Linha ${quadrado.dataset.linhaCubo}, Coluna ${quadrado.dataset.colunaCubo}`);
            });
        }
    </script>
</body>
</html>
