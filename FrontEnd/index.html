<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onitama - Movimentação das Peças</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            /* Substitua o caminho abaixo pela sua imagem de fundo geral */
            background-image: url('Assets/fundo_Onitama.png'); 
            background-size: cover;       /* Faz a imagem cobrir a tela inteira sem distorcer */
            background-position: center;  /* Centraliza a imagem na tela */
            background-repeat: no-repeat; /* Impede que a imagem fique se repetindo em mosaico */
            background-attachment: fixed; /* Deixa o fundo fixo se houver rolagem */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .tabuleiro-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            /* A imagem fornecida tem a proporção exata de 1.83 (Largura / Altura) */
            aspect-ratio: 1000 / 546; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin: 0 auto;
        }

        .imagem-fundo {
            width: 100%;
            height: 100%;     /* Faz a altura acompanhar a largura perfeitamente */
            display: block;
            pointer-events: none;
        }

        .grade-interativa {
            position: absolute;
            /* Ajustes milimétricos baseados na proporção da nova imagem */
            top: 12.5%;     /* Alinha perfeitamente com a linha preta superior */
            left: 30.0%;    /* Move o início do grid para a primeira linha preta vertical */
            width: 39.7%;   /* Largura total cobrindo as 5 colunas do desenho */
            height: 75.0%;  /* Altura total cobrindo as 5 linhas do desenho */
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
        }

        .quadrado {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Destaca sutilmente o cubo central para teste visual */
        .quadrado[data-tipo="cubo"] {
            outline: 1px dashed rgba(255, 255, 255, 0.1);
        }

        /* Efeito visual quando uma peça está sendo arrastada sobre o quadrado */
        .quadrado.drag-over {
            background: rgba(76, 175, 80, 0.3) !important; /* Verde translúcido */
        }

        /* --- ESTILO DAS CARTAS CORRIGIDO --- */
        .zona-carta {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.15);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Cartas do Adversário (Topo) - Invertidas em 270deg para que o oponente veja o verso do lado correto */
         .carta-topo-1 { 
            top: -24.5%; 
            left: 29.0%; 
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); /* Mantém deitada acompanhando o contêiner */
        }
        .carta-topo-2 { 
            top: -24.5%; 
            left: 51.8%; 
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); 
        }
        
        /* Cartas do Jogador Azul (Baixo) - Deitadas horizontalmente */
        .carta-baixo-1 { 
            bottom: -24.5%; 
            left: 29.0%; 
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); 
        }
        .carta-baixo-2 { 
            bottom: -24.5%; 
            left: 51.8%; 
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); 
        }
        
        /* Carta Lateral Direita - Deitada horizontalmente no slot da direita */
        .carta-lateral { 
            top: 42.5%; 
            right: -13.5%; 
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); 
        }

        /* Verso do Baralho/Deck na Esquerda - Deitada horizontalmente no slot da esquerda */
        .baralho-deck { 
            top: 42.5%; 
            left: -13.5%;            
            width: 19.3%;           
            height: 20.0%;          
            transform: rotate(0deg); 
            background-image: url('Assets/Carta_Inversa_Onitama.png'); 
            background-color: rgba(139, 0, 0, 0.35); 
            border-color: rgba(139, 0, 0, 0.6); 
            background-size: cover; 
        }

        /* --- ESTILO DAS PEÇAS CORRIGIDO E AUMENTADO --- */
        .peca {
            box-sizing: border-box;
            width: 90%;
            height: auto;
            max-width: 90%;
            max-height: 90%;
            aspect-ratio: 1 / 1;
            border-radius: 50%; 
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.15rem;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            user-select: none;
            z-index: 3;
            transition: filter 0.15s ease, box-shadow 0.15s ease;
        }

        .peca:hover {
            filter: brightness(1.12);
        }

        .peca:active {
            cursor: grabbing;
            filter: brightness(0.95);
        }

        /* Peças do Jogador Azul */
        .peca.azul { 
            background: radial-gradient(circle at 35% 35%, #42a5f5, #1976d2); 
            border: 2px solid #0d47a1; 
        }

        .peca.azul.mestre { 
            width: 96%;
            max-width: 96%;
            max-height: 96%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #1e88e5, #0d47a1); 
            border: 3px solid #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.65), 0 4px 8px rgba(0, 0, 0, 0.4);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }  

        /* Peças do Jogador Vermelho */
        .peca.vermelho { 
            background: radial-gradient(circle at 35% 35%, #ef5350, #d32f2f); 
            border: 2px solid #b71c1c; 
        }

        .peca.vermelho.mestre { 
            width: 96%;
            max-width: 96%;
            max-height: 96%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #e53935, #b71c1c); 
            border: 3px solid #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.65), 0 4px 8px rgba(0, 0, 0, 0.4);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* --- Interface de rede / jogo (Trabalho 02) --- */
        #painel {
            position: fixed;
            top: 8px;
            left: 8px;
            width: 270px;
            z-index: 10;
            font-size: 0.8rem;
            color: #fff;
            pointer-events: none;
        }
        #status {
            background: rgba(0, 0, 0, 0.75);
            border-left: 5px solid #888;
            padding: 8px 10px;
            border-radius: 4px;
            font-weight: bold;
            line-height: 1.3;
        }
        #status.vez-minha { border-color: #4caf50; }
        #status.erro { border-color: #f44336; }
        #log {
            margin-top: 6px;
            background: rgba(0, 0, 0, 0.55);
            padding: 6px 8px;
            border-radius: 4px;
            font-family: Consolas, monospace;
            font-size: 0.68rem;
            max-height: 230px;
            overflow: hidden;
            word-break: break-all;
        }
        #log div.env { color: #ffd54f; }
        #log div.rec { color: #aed581; }
        .zona-carta.minha { cursor: pointer; }
        .zona-carta.minha:hover { filter: brightness(1.15); }
        .zona-carta.selecionada {
            outline: 4px solid #ffd700;
            box-shadow: 0 0 14px #ffd700;
        }
        #fim {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
        }
        #fim button { font-size: 1.1rem; padding: 10px 24px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="painel">
        <div id="status">Conectando ao servidor...</div>
        <div id="log"></div>
    </div>

    <div id="fim">
        <div id="fim-texto"></div>
        <button id="fim-botao">Jogar novamente</button>
    </div>

    <!-- As zonas "azul" ficam sempre embaixo e mostram as cartas DO JOGADOR LOCAL;
         as zonas "vermelho" ficam em cima e mostram as cartas do adversário. -->
    <div class="tabuleiro-container">
        <img class="imagem-fundo" src="Assets/tabuleir_onitama_melhorado.png" alt="Tabuleiro">

        <!-- Tabuleiro Central -->
        <div class="grade-interativa" id="grade"></div>

        <!-- Zonas das Cartas -->
        <div class="zona-carta carta-topo-1" id="carta-vermelho-1"></div>
        <div class="zona-carta carta-topo-2" id="carta-vermelho-2"></div>
        <div class="zona-carta carta-baixo-1" id="carta-azul-1"></div>
        <div class="zona-carta carta-baixo-2" id="carta-azul-2"></div>
        <div class="zona-carta carta-lateral" id="carta-reserva"></div>

        <!-- Espaço para o Baralho -->
        <div class="zona-carta baralho-deck" id="deck-baralho">BARALHO</div>
    </div>


    <script>
        // ==========================================================================
        //  CLIENTE ONITAMA
        //  Este código NÃO decide nada sobre as regras: ele envia a intenção de jogada
        //  ao servidor (MOVE|...) e redesenha o tabuleiro com o STATE que o servidor
        //  devolve. Assim os dois jogadores sempre enxergam o mesmo estado.
        //  A notação das mensagens está documentada no README.md.
        // ==========================================================================
        const grade = document.getElementById('grade');
        const elStatus = document.getElementById('status');
        const elLog = document.getElementById('log');

        // ---- Catálogo de cartas (id = mesmo identificador usado pelo servidor) ----
        const CARTAS = [
            // Jogo Base (16 Cartas Clássicas)
            { id: 'SAPO', nome: 'Sapo', imagem: 'Assets/sapo.png' },
            { id: 'DRAGAO', nome: 'Dragão', imagem: 'Assets/dragao.png' },
            { id: 'SERPENTE', nome: 'Serpente do Mar', imagem: 'Assets/serpente.png' },
            { id: 'TIGRE', nome: 'Tigre', imagem: 'Assets/tigre.png' },
            { id: 'CARANGUEJO', nome: 'Caranguejo', imagem: 'Assets/caranguejo.png' },
            { id: 'MACACO', nome: 'Macaco', imagem: 'Assets/macaco.png' },
            { id: 'GARCA', nome: 'Garça', imagem: 'Assets/garca.png' },
            { id: 'GALO', nome: 'Galo', imagem: 'Assets/galo.png' },
            { id: 'BOI', nome: 'Boi', imagem: 'Assets/boi.png' },
            { id: 'CAVALO', nome: 'Cavalo', imagem: 'Assets/cavalo.png' },
            { id: 'ENGUIA', nome: 'Enguia', imagem: 'Assets/enguia.png' },
            { id: 'ELEFANTE', nome: 'Elefante', imagem: 'Assets/elefante.png' },
            { id: 'LOUVA_DEUS', nome: 'Louva-a-Deus', imagem: 'Assets/louva_deus.png' },
            { id: 'JAVALI', nome: 'Javali', imagem: 'Assets/javali.png' },
            { id: 'COELHO', nome: 'Coelho', imagem: 'Assets/coelho.png' },
            { id: 'GANSO', nome: 'Ganso', imagem: 'Assets/ganso.png' },
            // Expansão: Sensei's Path
            { id: 'GIRAFA', nome: 'Girafa', imagem: 'Assets/girafa.png' },
            { id: 'FENIX', nome: 'Fênix', imagem: 'Assets/fenix.png' },
            { id: 'TARTARUGA', nome: 'Tartaruga', imagem: 'Assets/tartaruga.png' },
            { id: 'CACHORRO', nome: 'Cachorro', imagem: 'Assets/cachorro.png' },
            { id: 'RATO', nome: 'Rato', imagem: 'Assets/rato.png' },
            { id: 'COBRA', nome: 'Cobra', imagem: 'Assets/cobra.png' },
            { id: 'LONTRA', nome: 'Lontra', imagem: 'Assets/lontra.png' },
            { id: 'PANDA', nome: 'Panda', imagem: 'Assets/panda.png' },
            { id: 'URSO', nome: 'Urso', imagem: 'Assets/urso.png' },
            { id: 'RAPOSA', nome: 'Raposa', imagem: 'Assets/raposa.png' }
        ];
        const cartaPorId = Object.fromEntries(CARTAS.map(c => [c.id, c]));
        const nomeCarta = id => (cartaPorId[id] ? cartaPorId[id].nome : id);

        // ---- Estado local (apenas o necessário para desenhar; a verdade está no servidor) ----
        let eu = 0;                    // número do jogador desta janela (1 = azul, 2 = vermelho)
        let vez = 0;                   // quem joga agora, segundo o servidor
        let cartaSelecionada = null;   // id da carta escolhida para a próxima jogada
        let fase = 'ESPERANDO';

        // O jogador 2 enxerga o tabuleiro girado 180° para ter suas peças sempre embaixo.
        // A mesma função converte servidor<->tela (a conversão é a sua própria inversa).
        function girar(linha, coluna) {
            return eu === 2 ? [4 - linha, 4 - coluna] : [linha, coluna];
        }

        // ==========================================
        //    CONEXÃO WEBSOCKET COM O SERVIDOR JAVA
        // ==========================================
        const params = new URLSearchParams(location.search);
        const host = location.hostname || 'localhost';
        const socket = new WebSocket(params.get('server') || `ws://${host}:8080`);

        socket.onopen = () => registrar('Conectado ao servidor.', 'rec');
        socket.onclose = () => status('Conexão com o servidor perdida.', 'erro');
        socket.onerror = () => status('Não foi possível conectar ao servidor (porta 8080).', 'erro');
        socket.onmessage = (event) => tratarMensagem(event.data);

        function enviar(msg) {
            socket.send(msg);
            registrar('▶ ' + msg, 'env');
        }

        // ==========================================
        //    INTERPRETAÇÃO DAS MENSAGENS DO SERVIDOR
        // ==========================================
        function tratarMensagem(msg) {
            registrar('◀ ' + msg, 'rec');
            const c = msg.split('|');
            switch (c[0]) {
                case 'CONNECT':
                    eu = parseInt(c[1]);
                    document.title = `Onitama - Jogador ${eu} (${eu === 1 ? 'Azul' : 'Vermelho'})`;
                    break;
                case 'WAIT':
                    status(c[1]);
                    esconderFim();
                    break;
                case 'START':
                    esconderFim();
                    cartaSelecionada = null;
                    break;
                case 'CARDS':   // cartas recebidas no início (o STATE seguinte desenha tudo)
                    break;
                case 'TURN':
                    vez = parseInt(c[1]);
                    break;
                case 'MOVED':
                    break;      // o STATE que vem a seguir redesenha o tabuleiro
                case 'CAPTURE':
                    break;
                case 'SWAP':
                    if (parseInt(c[1]) === eu) cartaSelecionada = null;
                    break;
                case 'STATE':
                    desenharEstado(c);
                    break;
                case 'WIN':
                    mostrarFim(parseInt(c[1]) === eu ? '🏆 Você venceu!' : 'Fim de jogo', c[2]);
                    break;
                case 'LOSE':
                    mostrarFim('Você perdeu...', c[2]);
                    break;
                case 'OPPONENT_LEFT':
                    status('O adversário desconectou.', 'erro');
                    break;
                case 'ERROR':
                    status('⚠ ' + (c[2] || c[1]), 'erro');
                    break;
            }
        }

        // ==========================================
        //    DESENHO DO ESTADO RECEBIDO (STATE)
        //    STATE|vez|fase|mao1a,mao1b|mao2a,mao2b|reserva|tabuleiro(25 casas)
        // ==========================================
        function desenharEstado(c) {
            vez = parseInt(c[1]);
            fase = c[2];
            const maos = { 1: c[3].split(','), 2: c[4].split(',') };
            const minhas = maos[eu === 2 ? 2 : 1];
            const deles = maos[eu === 2 ? 1 : 2];

            if (cartaSelecionada && !minhas.includes(cartaSelecionada)) cartaSelecionada = null;

            aplicarCarta('carta-azul-1', minhas[0], true);
            aplicarCarta('carta-azul-2', minhas[1], true);
            aplicarCarta('carta-vermelho-1', deles[0], false);
            aplicarCarta('carta-vermelho-2', deles[1], false);
            aplicarCarta('carta-reserva', c[5], false);

            // Redesenha as peças a partir da matriz do servidor
            grade.querySelectorAll('.peca').forEach(p => p.remove());
            const tab = c[6];
            for (let l = 0; l < 5; l++) {
                for (let col = 0; col < 5; col++) {
                    const ch = tab.charAt(l * 5 + col);
                    if (ch === '.') continue;
                    const dono = ch.toLowerCase() === 'a' ? 1 : 2;
                    const mestre = ch === ch.toUpperCase();
                    const [dl, dc] = girar(l, col);
                    criarPeca(dono === 1 ? 'azul' : 'vermelho', mestre ? 'mestre' : 'aluno',
                              `quadrado-${dl}-${dc}`, mestre ? 'MESTRE' : 'A', l, col, dono === eu);
                }
            }
            atualizarStatusDeTurno();
        }

        function atualizarStatusDeTurno() {
            const cor = eu === 1 ? 'Azul' : 'Vermelho';
            if (fase === 'ESPERANDO') return;
            if (fase === 'FIM') return;
            if (vez === eu) {
                status(`Você é o jogador ${eu} (${cor}). SUA VEZ: escolha uma carta e arraste uma peça.`, 'vez-minha');
            } else {
                status(`Você é o jogador ${eu} (${cor}). Aguarde a jogada do adversário...`);
            }
        }

        // ---- Cartas ----
        function aplicarCarta(idElemento, idCarta, minha) {
            const el = document.getElementById(idElemento);
            el.style.border = 'none';
            el.dataset.cartaId = idCarta || '';
            el.classList.toggle('minha', minha && !!cartaPorId[idCarta]);
            el.classList.toggle('selecionada', minha && idCarta === cartaSelecionada);
            if (cartaPorId[idCarta]) {
                el.style.backgroundImage = `url('${cartaPorId[idCarta].imagem}')`;
                el.title = cartaPorId[idCarta].nome;
            } else {
                el.style.backgroundImage = 'none';
                el.title = '';
            }
            el.onclick = minha ? () => selecionarCarta(el.dataset.cartaId) : null;
        }

        function selecionarCarta(id) {
            if (!cartaPorId[id]) return;
            cartaSelecionada = id;
            ['carta-azul-1', 'carta-azul-2'].forEach(z => {
                const el = document.getElementById(z);
                el.classList.toggle('selecionada', el.dataset.cartaId === id);
            });
            status(`Carta "${nomeCarta(id)}" selecionada. Arraste uma peça sua.`, vez === eu ? 'vez-minha' : '');
        }

        // ==========================================
        // GERAÇÃO DO TABULEIRO (casas 5x5 da tela)
        // ==========================================
        for (let linha = 0; linha < 5; linha++) {
            for (let coluna = 0; coluna < 5; coluna++) {
                const div = document.createElement('div');
                div.classList.add('quadrado');
                div.dataset.tipo = 'cubo';
                div.dataset.linhaCubo = linha;
                div.dataset.colunaCubo = coluna;
                div.id = `quadrado-${linha}-${coluna}`;
                configurarZonaDeSoltura(div);
                grade.appendChild(div);
            }
        }

        // FUNÇÃO PARA CRIAR PEÇAS DINAMICAMENTE (linhaServ/colServ = posição real no servidor)
        function criarPeca(time, tipo, idQuadradoAlvo, texto, linhaServ, colServ, minha) {
            const peca = document.createElement('div');
            peca.classList.add('peca', time, tipo);
            peca.innerText = texto;
            peca.draggable = minha; // só as peças do jogador local podem ser arrastadas
            if (!minha) peca.style.cursor = 'default';
            peca.id = `peca-${time}-${tipo}-${idQuadradoAlvo}`;

            peca.addEventListener('dragstart', (e) => {
                // guarda a origem na coordenada do SERVIDOR
                e.dataTransfer.setData('text/plain', `${linhaServ},${colServ}`);
            });

            document.getElementById(idQuadradoAlvo).appendChild(peca);
        }

        // Soltar a peça apenas ENVIA o pedido de jogada; quem move de fato é o servidor.
        function configurarZonaDeSoltura(quadrado) {
            quadrado.addEventListener('dragover', (e) => {
                e.preventDefault();
                quadrado.classList.add('drag-over');
            });

            quadrado.addEventListener('dragleave', (e) => {
                if (!quadrado.contains(e.relatedTarget)) quadrado.classList.remove('drag-over');
            });

            quadrado.addEventListener('drop', (e) => {
                e.preventDefault();
                quadrado.classList.remove('drag-over');

                const origem = e.dataTransfer.getData('text/plain');
                if (!origem) return;
                const [lo, co] = origem.split(',').map(Number);
                const [ld, cd] = girar(Number(quadrado.dataset.linhaCubo), Number(quadrado.dataset.colunaCubo));
                if (lo === ld && co === cd) return;

                if (!cartaSelecionada) {
                    status('⚠ Clique em uma das suas cartas antes de mover uma peça.', 'erro');
                    return;
                }
                enviar(`MOVE|${eu}|${cartaSelecionada}|${lo}|${co}|${ld}|${cd}`);
            });
        }

        // ==========================================
        //    MENSAGENS NA TELA
        // ==========================================
        function status(texto, classe) {
            elStatus.textContent = texto;
            elStatus.className = classe || '';
        }

        function registrar(texto, classe) {
            const d = document.createElement('div');
            d.className = classe || '';
            d.textContent = texto;
            elLog.prepend(d);
            while (elLog.children.length > 14) elLog.removeChild(elLog.lastChild);
        }

        const motivos = {
            MESTRE_CAPTURADO: 'O Mestre foi capturado.',
            TEMPLO: 'Um Mestre chegou ao templo adversário.',
            DESCONEXAO: 'O adversário desconectou.'
        };

        function mostrarFim(titulo, motivo) {
            document.getElementById('fim-texto').innerHTML =
                `${titulo}<div style="font-size:1rem;margin-top:8px">${motivos[motivo] || motivo || ''}</div>`;
            document.getElementById('fim').style.display = 'flex';
            status(titulo, vez === eu ? '' : '');
        }

        function esconderFim() {
            document.getElementById('fim').style.display = 'none';
        }

        document.getElementById('fim-botao').onclick = () => {
            esconderFim();
            enviar(`RESTART|${eu}`);
        };
    </script>
</body>
</html>
